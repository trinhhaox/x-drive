name: Build, Test & Release XDrive macOS

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OrbitCore Unit & Integration Tests
        run: swift test

      - name: Run Cloudflare Workers D1/R2 Backend Tests
        run: cd backend && node --test test/worker.test.mjs

      - name: Build XDrive.app Multi-Process Bundle
        run: ./Scripts/build.sh

      - name: Verify Self-Tests
        run: |
          ./build/XDrive.app/Contents/MacOS/XDrive --self-test
          ./build/XDrive.app/Contents/PlugIns/OrbitFinder.appex/Contents/MacOS/OrbitFinder --self-test

      - name: Package Release Artifacts (.zip, .dmg, SHA256SUMS.txt)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent build/XDrive.app "build/XDrive-${VERSION}-macos-arm64.zip"
          hdiutil create -volname "XDrive" -srcfolder build/XDrive.app -ov -format UDZO "build/XDrive-${VERSION}.dmg"
          cd build
          shasum -a 256 "XDrive-${VERSION}-macos-arm64.zip" "XDrive-${VERSION}.dmg" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            "build/XDrive-${VERSION}.dmg" \
            "build/XDrive-${VERSION}-macos-arm64.zip" \
            "build/SHA256SUMS.txt" \
            --title "XDrive ${GITHUB_REF_NAME}" \
            --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" \
            "build/XDrive-${VERSION}.dmg" \
            "build/XDrive-${VERSION}-macos-arm64.zip" \
            "build/SHA256SUMS.txt" \
            --clobber

